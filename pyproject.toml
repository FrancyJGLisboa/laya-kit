[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-kit"
version = "0.1.0"
description = "Typed judgements from a local classifier: choice, noul and score, with a threshold you calibrate."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Current hardware: this is enough.
model = ["laya", "torch>=2.0", "transformers>=4.48"]
# Intel macOS: torch stopped at 2.2.2 there, its Dynamo needs Python <= 3.11,
# transformers >= 4.55 requires torch >= 2.5, and torch 2.2.2 was built against NumPy 1.x.
model-intel-macos = ["laya", "torch==2.2.2", "transformers==4.48.3", "numpy<2"]

[tool.setuptools.packages.find]
include = ["laya_kit*"]
